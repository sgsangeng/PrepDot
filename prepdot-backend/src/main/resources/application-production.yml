server:
  port: 8080
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto

knife4j:
  enable: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

jwt:
  secret: ${JWT_SECRET}
  expire-days: 7

ai:
  deepseek:
    api-url: https://api.deepseek.com/v1/chat/completions
    system-key: ${AI_DEEPSEEK_SYSTEM_KEY:}
    model: deepseek-chat
  agent:
    max-iterations: 4
    critic-max-retries: 1

logging:
  level:
    root: INFO
    com.prepdot: INFO
